[package]
name = "skycartel"
version = "1.0.0"
edition = "2021"
autobins = false

[lib]
name = "skycartel"
path = "src/lib.rs"

[dependencies]
common-game = "3.0.0"
crossbeam-channel = "0.5"

# External planet implementations from the Faire
orbitron             = { git = "https://github.com/Advanced-Programming-2025-Orbitron/Orbitron.git" }
rusteze              = { git = "https://github.com/Rust-eze-Advanced-Programming/pub-Rust-eze.git", package = "pub-rust-eze" }
crabtorio            = { git = "https://github.com/crabtorio/crabtorio.git", package = "planet" }
immutable_cosmic_borrow = { git = "https://github.com/ImmutableCosmicBorrow/planet.git" }
luna4                = { git = "https://github.com/luna4-ap2025/Planet_Luna4.git" }
black_adidas_shoe    = { git = "https://github.com/black-adidas-shoe-org/planet.git" }
astro_parrot         = { git = "https://github.com/astro-parrot/astro-parrot.git", package = "astro-parrot" }
log = { version = "0.4", features = ["std"] }
thiserror = "2.0"
axum = { version = "0.7", features = ["ws", "macros", "json"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10.1"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.4"

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "skycartel-gui-server"
path = "src/bin/gui_server.rs"

[[bin]]
name = "rustyplanets"
path = "src/bin/main.rs"
